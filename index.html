<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="creatL's personal homepage and tool site"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%logo192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <script type="text/javascript">
      (function (l) {
        var params = new URLSearchParams(l.search);
        if (params.has('p')) {
          var path = params.get('p') || '/';
          var query = params.get('q');

          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + path + (query ? '?' + query : '') + l.hash
          );
        }
      })(window.location);
    </script>
    <title>creatL's Site</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
